generated: '2026-09-12'
method: searched
source: https://help.agiloft.com/space/HELP/43715778/REST%20Interface
docs:
- https://help.agiloft.com/space/HELP/43715778/REST%20Interface
- https://help.agiloft.com/space/HELP/43716366/API%20Web%20Services
