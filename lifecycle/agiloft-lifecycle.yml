  http_status: 200
  verdict: dead
  note: >-
    status.agiloft.com resolves and answers 200, but the body is the Site24x7 StatusIQ error card
    reading "No status page found with this domain mapping" — the CNAME still points at StatusIQ
    but the status page behind it is gone or unmapped. This is a soft-404, so no StatusPage pointer
