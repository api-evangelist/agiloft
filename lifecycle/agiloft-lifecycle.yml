versioning:
  scheme: numbered platform releases; no version segment in the REST path
  current: Release 34
  current_release_date: '2026-07'
  cadence:
    core_platform: February, July and November feature releases, plus monthly maintenance releases
    connected_services: monthly feature releases, plus anytime maintenance releases
  docs: https://help.agiloft.com/space/HELP/43715649/What's%20New
  api_versioning_note: >-
    The /ewws/ REST operation names are the versioned surface — there is no /v1/ segment, Accept
    header version, or date-pinned API version. SCIM is the exception and carries its version in
    the path (/scim/v2). Each KB's generated OpenAPI document therefore describes that KB at that
    moment, not a stable public API version.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    No published API deprecation policy, no RFC 8594 Sunset or Deprecation header support, and no
    documented notice period for removing an operation. Retirements surface only as release-note
    entries — the July 2026 core release carried a "Removing obsolete integrations" item, and the
    docs mark the SOAP interface as legacy and not recommended for new integrations without naming
    a removal date. An integrator has no machine-readable signal that an operation is going away.
deprecated_surfaces:
- surface: SOAP Web Services API
  status: legacy
  note: >-
    "SOAP-based web services are available but aren't recommended for new integrations. The
    OpenAPI and REST interfaces provide broader functionality and are actively maintained." SOAP
    is disabled by default on new knowledgebases.
  docs: https://help.agiloft.com/space/HELP/43716450/Legacy%20SOAP%20API%20Setup
  sunset_date: null
- surface: ExtAuth authorization mechanism
  status: legacy
  note: >-
    Agiloft's pre-OAuth token mechanism, retained for backward compatibility with existing
    integrations. OAuth 2.0 is the recommended protocol for new integrations.
  docs: https://help.agiloft.com/space/HELP/703889445
  sunset_date: null
- surface: REST /ewws/ operation interface
  status: maintained-but-secondary
  note: >-
    Agiloft now directs new integrations to the generated OpenAPI interface and positions the
    /ewws/ operations as the fallback — "use the REST interface if you already use it for an
    existing integration or need to access an endpoint that isn't exposed through OpenAPI."
  docs: https://help.agiloft.com/space/HELP/43716366/API%20Web%20Services
