licensing_notes:
- >-
    API access is gated by edition, not metered by call volume — there is no published per-call or
    per-request charge, and no rate limit (see rate-limits/agiloft-rate-limits.yml).
- >-
    Each OAuth 2.0 client must be bound to its own native Agiloft service-user account, and each
    such account requires an Admin or Standard license. So the real cost of an integration is
    measured in licensed seats, one per OAuth client, not in API calls.
- >-
    Group membership in the REST allow-list (Setup > System > Manage Web Services) is an additional
    gate on top of the license.
