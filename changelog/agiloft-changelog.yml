entries:
- version: Release 34
  component: Agiloft Core Platform
  date: '2026-07'
  breaking: null
  highlights:
  - >-
      SCIM 2.0 user provisioning introduced. An identity provider becomes the source of truth for
      user accounts, creating, updating, deactivating and reactivating KB users automatically.
      Group and custom-attribute sync are not yet supported.
  - >-
      Integration Hub connector security hardened: Agiloft now adds environment-specific details
      and a signature to outbound webhook requests, and the connector validates source and
      signature before triggering a recipe, so a development KB cannot trigger a production recipe.
      Existing recipes must be stopped and restarted to pick it up.
  - Word app login persists across sessions until the user manually logs out.
  - >-
      User activation and deactivation via a new User Is Active field on the People table,
      deactivation ends active sessions immediately and stops outbound email, without losing audit
      data.
  - Replies to comment-notification emails are discarded rather than run through inbound email rules; notifications now send from no-reply@agiloft.com.
  - Dashboard localization; dashboards can be filtered by Choice fields.
  - Time-based rule start times can be fine-tuned; $global.null clears an entire linked set.
  - Obsolete integrations removed.
  - Bug fixes.
