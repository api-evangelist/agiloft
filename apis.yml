aid: agiloft
name: Agiloft
description: >-
  Agiloft is a Redwood City, California software company that sells an enterprise Contract Lifecycle
  Management (CLM) platform built on a no-code business process engine, used by legal, procurement,
  finance and IT teams to request, author, negotiate, approve, execute, store and report on
  agreements. Every deployment is a customer-specific knowledgebase (KB) whose tables and fields are
  configured per tenant, so the API surface is generated from that live configuration rather than
  published as one fixed catalog contract. Agiloft exposes three machine interfaces on each KB: an
  OpenAPI/Swagger interface generated from the tenant's own tables (browsable and downloadable inside
  the KB at Setup > System > View REST documentation), a stable operation-style REST interface under
  /ewws/ covering create, read, update, delete, upsert, select, search, attachment, lock, table
  introspection and action-button execution, and a legacy SOAP interface whose WSDL is likewise
  generated per knowledgebase. Authorization is OAuth 2.0 (authorization code, authorization code
  with PKCE, and client credentials) or JWT bearer tokens, with a REST operation scope list and
  group permissions layered on top. Agiloft also ships an outbound webhook service with URL
  verification and retry, and SCIM 2.0 user provisioning at /scim/v2.
