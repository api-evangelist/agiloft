- aid: agiloft:webhooks
  image: https://cdn.prod.website-files.com/69df514a8d0f4dbcfa25740b/6a749eebcf2b3e9c0d935735_logo%20(1).svg
  name: Agiloft CLM Webhooks
  description: >-
    Agiloft's outbound event surface. A webhook is registered per table and event type (Create,
    Update or Delete), optionally filtered by a record-filter expression and by modification type
    (Email, Web or API), and Agiloft POSTs the selected field values to the subscriber's HTTPS URL
    when the event fires. Registration is performed either in Setup > Integration > Webhooks Setup
    or through the /ewws/webhooks REST resource, and Agiloft verifies the subscriber URL with a GET
    carrying a Verification-Code header before the subscription becomes active.
  humanURL: https://help.agiloft.com/space/HELP/43714342/Webhooks
  baseURL: https://{subdomain}.agiloft.com/ewws/webhooks
  tags:
  - Webhook
  - Event
  tags_raw:
  - Webhooks
  - Events
  properties:
  - type: Documentation
    url: https://help.agiloft.com/space/HELP/43714342/Webhooks
  - type: Webhooks
    url: asyncapi/agiloft-webhooks.yml
- aid: agiloft:scim
  image: https://cdn.prod.website-files.com/69df514a8d0f4dbcfa25740b/6a749eebcf2b3e9c0d935735_logo%20(1).svg
  name: Agiloft CLM SCIM 2.0 Service
  description: >-
    Agiloft's SCIM 2.0 user provisioning endpoint, served per knowledgebase at /scim/v2 and
    authenticated with a bearer token generated from the KB's SCIM profile. An identity provider
    that speaks SCIM 2.0 — Microsoft Entra ID and Okta are documented explicitly — creates,
    updates, deactivates and reactivates People records in the KB. Group and custom-attribute
    synchronization are not supported at this time.
  humanURL: https://help.agiloft.com/space/HELP/778928159/Set%20Up%20SCIM
  baseURL: https://{subdomain}.agiloft.com/scim/v2
