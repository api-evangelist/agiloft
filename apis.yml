apis:
- aid: agiloft:rest
  image: https://cdn.prod.website-files.com/69df514a8d0f4dbcfa25740b/6a749eebcf2b3e9c0d935735_logo%20(1).svg
  name: Agiloft CLM REST API
  description: >-
    The Agiloft REST interface, served from every Agiloft knowledgebase under /ewws/. It exposes
    twenty documented operations — EWCreate, EWRead, EWUpdate, EWDelete, EWUpsert, EWSelect,
    EWSearch, EWLogin, EWLogout, EWAttach, EWAttachInfo, EWRemoveAttachment, EWRetrieve, EWLock,
    EWTable, EWSavedSearch, EWAsyncStatus, EWActionButton, EWHotlinks and GetChoiceLineID — over
    application/x-www-form-urlencoded requests, returning either JavaScript-evaluable EWREST_*
    assignments or JSON when the .json decorator is used. A per-knowledgebase OpenAPI document and
    Swagger UI, generated from the tenant's own tables and fields, is available to authenticated
    users inside the KB.
  humanURL: https://help.agiloft.com/space/HELP/43715778/REST%20Interface
  baseURL: https://{subdomain}.agiloft.com/ewws
  tags:
  - REST
  - Contract Lifecycle Management
  - Contract Management
