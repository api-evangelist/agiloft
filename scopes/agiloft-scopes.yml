docs: https://help.agiloft.com/space/HELP/43714795/Control%20Access%20to%20REST%20API%20Operations
note: >-
  Agiloft's scope model has two distinct halves and neither is a conventional OAuth scope string
  namespace. (1) The OAuth 2.0 authorization request carries exactly one scope value of the form
  permissions_for:{CONTACT_ID}, naming the Agiloft contact record whose permissions the token will
  carry — the permission set itself lives on that user, not in the scope string. (2) A separate
  Scope parameter, configured at Setup > Integration > Access Token API > Configure, restricts
  which REST operations a given access token may invoke. A blank Scope parameter grants every
  operation, which the docs flag as a hazard. Both are documented publicly; no scope catalogue was
  derived from a spec because Agiloft's OpenAPI is generated per knowledgebase behind KB login.
schemes:
- name: OAuth2
  source: https://help.agiloft.com/space/HELP/43716464/Use%20OAuth2%20to%20Access%20REST%20API
  flows:
  - flow: authorizationCode
    authorizationUrl: https://{hostname}/ewws/oauth
    tokenUrl: https://{hostname}/ewws/otoken
  - flow: authorizationCodePKCE
    authorizationUrl: https://{hostname}/ewws/oauth
    tokenUrl: https://{hostname}/ewws/otoken
  - flow: clientCredentials
    tokenUrl: https://{hostname}/ewws/otoken
scopes:
- scope: 'permissions_for:{CONTACT_ID}'
  description: >-
    The only OAuth scope value Agiloft accepts. CONTACT_ID is the numeric id of the Agiloft contact
    record configured in the API application's "Associate this Application with Contact ID" field —
    for example permissions_for:222. The token then carries that user's group permissions.
  flows: [authorizationCode, authorizationCodePKCE]
  required: true
  sources: [https://help.agiloft.com/space/HELP/43716464/Use%20OAuth2%20to%20Access%20REST%20API]
operation_scopes:
